name: Agents API smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agents-api-tickadoo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      # .node-version pins an exact published release: 24.21.0 is the
      # 2026-09-07 LTS "Krypton" release listed at
      # https://nodejs.org/dist/index.json. setup-node fails the job if a
      # pinned version is not published; this step also fails if the runtime
      # on PATH is not the pinned one.
      - name: Confirm the pinned Node runtime
        run: |
          pin="$(tr -d '[:space:]' < .node-version)"
          expected="v${pin#v}"
          actual="$(node --version)"
          echo "Node runtime ${actual}, pinned ${expected}"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::Node ${actual} does not match .node-version (${expected})"
            exit 1
          fi
      - run: npm ci
      - name: Require OPENAI_API_KEY
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::OPENAI_API_KEY is not available to tickadoo/tickadoo-mcp."
            echo "Francis/Mark must add OPENAI_API_KEY to tickadoo-mcp repo secrets or ensure the org secret is visible to this repo."
            echo "Do not invent keys. Do not reuse Cloudflare ads keys."
            exit 1
          fi
      - name: Run Agents API → tickadoo MCP smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run smoke:agents-api
