# Publish server.json to the Official MCP Registry via GitHub OIDC.
#
# Why this exists: `mcp-publisher login github` (device flow) cannot publish
# the io.github.tickadoo/* namespace while the tickadoo org restricts
# third-party OAuth apps. OIDC from Actions runs as the repo itself, so no
# OAuth app approval is needed.
#
# SECURITY: the job is bound to the `mcp-registry` GitHub environment, whose
# deployment-branch policy allows ONLY the `main` branch. Without this,
# workflow_dispatch would let any repo writer run the workflow from their own
# branch and publish a tampered server.json under the tickadoo namespace
# (the OIDC token grants io.github.tickadoo/* based on repository_owner
# alone). Create the environment once in repo Settings -> Environments ->
# New environment `mcp-registry` -> Deployment branches -> Selected
# branches -> add `main`. The workflow fails closed until it exists.
#
# Run manually: Actions -> "Publish to MCP Registry" -> Run workflow.

name: Publish to MCP Registry

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mcp-registry
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned mcp-publisher
        run: |
          set -euo pipefail
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" -o /tmp/mcp-publisher.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          /tmp/mcp-publisher --version

      - name: Validate server.json
        run: /tmp/mcp-publisher validate server.json

      - name: Login via OIDC and publish
        run: |
          set -euo pipefail
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish server.json

      - name: Verify exact version in registry
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json;print(json.load(open("server.json"))["version"])')
          echo "Expecting version: $VERSION"
          curl -sS "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.tickadoo%2Ftickadoo-mcp/versions/${VERSION}" -o /tmp/ver.json
          VERSION="$VERSION" python3 - <<'EOF'
          import json, os
          v = os.environ['VERSION']
          raw = open('/tmp/ver.json').read()
          d = json.loads(raw)
          assert 'io.github.tickadoo/tickadoo-mcp' in raw, 'server name missing in version record'
          assert d.get('version') == v, f"version mismatch: {d.get('version')} != {v}"
          print(f'registry now serves version {v}')
          EOF
